<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Pupload</title>
<script>try { const theme = localStorage.getItem('pupload-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}</script>
<link rel="stylesheet" href="pupload.css">
<link rel="stylesheet" href="sign-in.css">
<script type="module" src="theme.js"></script>
<script type="module" src="sign-in.js"></script>
</head>
<body>
  <div class="corner">
    <div class="theme-picker">
      <button class="theme-picker-trigger" type="button" aria-expanded="false" aria-controls="theme-options" aria-label="Theme">
        <span class="theme-picker-icons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="auto"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="dark"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="close"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
      </button>
      <div class="theme-picker-options" id="theme-options" role="group" aria-label="Theme" inert>
        <button class="theme-picker-option" type="button" value="auto" aria-pressed="false" title="Auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg><span class="visually-hidden">Auto</span>
        </button>
        <button class="theme-picker-option" type="button" value="light" aria-pressed="false" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span class="visually-hidden">Light</span>
        </button>
        <button class="theme-picker-option" type="button" value="dark" aria-pressed="false" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="visually-hidden">Dark</span>
        </button>
      </div>
    </div>
  </div>
  <main class="sign-in">
    <div class="sign-in-head">
      <span class="wordmark">
        <span class="wordmark-tile" aria-hidden="true">
          <svg viewBox="0 0 1024 1024">
            <mask id="pupload-paw-arrow">
              <rect width="1024" height="1024" fill="#fff"/>
              <path d="M512 740 L512 606 M454 662 L512 604 L570 662" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
            <g fill="currentColor">
              <path mask="url(#pupload-paw-arrow)" d="M512 494 C594 494 652 574 684 644 C716 714 684 790 612 790 C570 790 548 770 512 770 C476 770 454 790 412 790 C340 790 308 714 340 644 C372 574 430 494 512 494 Z"/>
              <ellipse cx="300" cy="468" rx="62" ry="80" transform="rotate(-28 300 468)"/>
              <ellipse cx="724" cy="468" rx="62" ry="80" transform="rotate(28 724 468)"/>
              <ellipse cx="428" cy="322" rx="66" ry="88" transform="rotate(-10 428 322)"/>
              <ellipse cx="596" cy="322" rx="66" ry="88" transform="rotate(10 596 322)"/>
            </g>
          </svg>
        </span>
        Pupload
      </span>
      <h1>Sign in</h1>
    </div>
    <form class="stack sign-in-form" method="post">
      <label class="field">
        <span class="field-label">Username</span>
        <input class="input" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="alert alert--error" role="alert" hidden></p>
      <button class="button button--primary button--block" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
